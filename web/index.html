<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A new Flutter project.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="StarCop">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>StarCop</title>
  <link rel="manifest" href="manifest.json">
  <style>
    /* Loader while the game downloads; the game's own LoadingScreen (same
       look) takes over once Flutter draws its first frame on top. */
    @font-face {
      font-family: Pixel;
      src: url("assets/assets/fonts/pixel.ttf");
    }
    html, body { margin: 0; height: 100%; background: #000; }
    #loading {
      position: fixed; inset: 0;
      display: flex; align-items: center; justify-content: center;
    }
    #loading .screen {
      /* The 256x192 virtual screen, scaled to fit like the game's. */
      width: min(100vw, 133.33vh); aspect-ratio: 4 / 3;
      background: #1D2B53; color: #FFF1E8;
      font-family: Pixel, monospace;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      font-size: calc(min(100vw, 133.33vh) * 8 / 256);
    }
    #loading .title {
      font-size: 1.375em; font-weight: bold; margin-bottom: 2em;
    }
    #loading .bar {
      width: 15em; height: 1em; margin-top: 0.75em;
      box-sizing: border-box; border: 0.125em solid #FFF1E8;
      padding: 0.125em; overflow: hidden;
    }
    #loading .fill {
      width: 30%; height: 100%; background: #00E756;
      animation: slide 1.2s steps(12) infinite;
    }
    @keyframes slide {
      from { transform: translateX(-100%); }
      to { transform: translateX(333%); }
    }
  </style>
</head>
<body>
  <div id="loading">
    <div class="screen">
      <div class="title">STAR COP</div>
      <div>Carregando...</div>
      <div class="bar"><div class="fill"></div></div>
    </div>
  </div>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
