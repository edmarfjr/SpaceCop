# Codemagic CI: Android APK and web builds of StarCop.
# Both run on every push to main, or by hand from the Codemagic UI.

definitions:
  environment: &environment
    flutter: 3.38.9
    java: 17
  triggering: &triggering
    events:
      - push
    branch_patterns:
      - pattern: main
        include: true
  scripts:
    - &get_packages
      name: Get packages
      script: flutter pub get
    - &tests
      name: Tests
      script: flutter test

workflows:
  android:
    name: Android
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      <<: *environment
      android_signing:
        # Keystore uploaded in Team settings > Code signing identities.
        - starcop_release
    triggering: *triggering
    scripts:
      - *get_packages
      - *tests
      # android/app/build.gradle.kts signs the release with this file.
      - name: Write key.properties
        script: |
          cat > "$CM_BUILD_DIR/android/key.properties" <<EOF
          storePassword=$CM_KEYSTORE_PASSWORD
          keyPassword=$CM_KEY_PASSWORD
          keyAlias=$CM_KEY_ALIAS
          storeFile=$CM_KEYSTORE_PATH
          EOF
      # BUILD_NUMBER grows on every build, so each APK installs over the last.
      - name: Build APK
        script: flutter build apk --release --build-number=$BUILD_NUMBER
    artifacts:
      - build/app/outputs/flutter-apk/*.apk

  web:
    name: Web
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment: *environment
    triggering: *triggering
    scripts:
      - *get_packages
      - *tests
      - name: Build web
        script: |
          flutter build web --release
          cd build/web && zip -r ../web.zip .
    artifacts:
      - build/web.zip
